<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse South African universities and open their undergraduate prospectuses.">
    <title>UniCompanion | View Universities &amp; Courses</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/courses.css">
    <link rel="stylesheet" href="../css/assistant.css">
    <link rel="stylesheet" href="../css/motion.css">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
    <script src="../js/motion.js" defer></script>
    <script src="../js/navigation.js" defer></script>
    <script src="../js/welcome-experience.js" defer></script>
    <script src="../js/university-catalog.js" defer></script>
    <script src="../js/courses.js" defer></script>
    <script src="../js/gemini-config.js" defer></script>
    <script src="../js/gemini-service.js" defer></script>
    <script src="../js/assistant.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="../index.html#home" class="logo">
            <img class="logo-icon" src="../assets/Navigation%20Icons/App%20Icon.png" alt="" aria-hidden="true">
            <span class="logo-text">
                <strong>UniCompanion</strong>
                <small>Your AI-Powered University Guide</small>
            </span>
        </a>

        <button class="menu-toggle"
                id="menu-toggle"
                type="button"
                aria-label="Open navigation"
                aria-expanded="false"
                aria-controls="navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="navigation" id="navigation" aria-label="Main navigation">
            <a href="../index.html#home" class="nav-link">
                <img class="nav-icon" src="../assets/Navigation%20Icons/home.png" alt="" aria-hidden="true"> Home
            </a>
            <a href="aps-calculator.html" class="nav-link">
                <img class="nav-icon" src="../assets/Navigation%20Icons/APS.png" alt="" aria-hidden="true"> APS &amp; Average Calculator
            </a>
            <a href="view-courses.html" class="nav-link active" aria-current="page">
                <img class="nav-icon" src="../assets/Navigation%20Icons/courses.png" alt="" aria-hidden="true"> View Courses
            </a>
            <a href="find-course.html" class="nav-link">
                <img class="nav-icon" src="../assets/Navigation%20Icons/find%20course.png" alt="" aria-hidden="true"> Find My Course
            </a>
        </nav>

        <form class="search-form" id="search-form" role="search">
            <label for="site-search" class="sr-only">Search universities or courses</label>
            <input type="search" id="site-search" placeholder="Search for universities or courses">
            <button type="submit" aria-label="Search">&#9906;</button>
        </form>
    </header>

    <main class="courses-page">
        <h1>View Universities &amp; Courses</h1>
        <p class="directory-status" id="directory-status" role="status" aria-live="polite" data-state="idle">
            Browse the university list or search by name.
        </p>
        <section class="university-directory" id="university-directory" aria-label="Universities">
            <!-- University cards are populated from the prospectus directory. -->
        </section>
    </main>

    <footer class="courses-footer">
        <p>&copy; 2026 UniCompanion. All rights reserved.</p>
    </footer>

    <div id="assistant-container"></div>
</body>
</html>
